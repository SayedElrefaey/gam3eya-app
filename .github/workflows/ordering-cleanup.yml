name: One-time ordering cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Finalize automatic descending ordering') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize ordering edits
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/models/models.dart')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(\n\s*final int sortOrder;){2,}', '\n  final int sortOrder;', s)
          s = re.sub(r'(\n\s*sortOrder: int\.tryParse\(\(j\[\'sort_order\'\].*?\) \?\? 0,){2,}', lambda m: '\n        sortOrder: int.tryParse((j[\'sort_order\'] ?? j[\'sortOrder\'] ?? 0).toString()) ?? 0,', s)
          # Collapse repeated constructor parameter if present.
          s = re.sub(r'(, required this\.sortOrder){2,}', ', required this.sortOrder', s)
          p.write_text(s, encoding='utf-8')

          p = Path('lib/screens/gam3eyas_tab.dart')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(\s+final sortCtrl = TextEditingController\(text: g\.sortOrder\.toString\(\)\);){2,}', '\n    final sortCtrl = TextEditingController(text: g.sortOrder.toString());', s)
          # Keep exactly one sort field in add form.
          a = s.find('Future<void> _openAddForm()')
          b = s.find('Future<void> _rename', a)
          if a >= 0 and b > a:
              seg = s[a:b]
              seg = re.sub(r'\n\s*TextField\(controller: sortCtrl,.*?\),\n\s*const SizedBox\(height: 10\),', '', seg)
              marker = 'TextField(controller: amountCtrl,'
              if marker in seg:
                  sort_field = "TextField(controller: sortCtrl, textAlign: TextAlign.right, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'الترتيب في القائمة (رقم - اختياري)', border: OutlineInputBorder())),\n                const SizedBox(height: 10),\n                TextField(controller: amountCtrl,"
                  seg = seg.replace(marker, sort_field, 1)
              s = s[:a] + seg + s[b:]
          p.write_text(s, encoding='utf-8')

          p = Path('lib/screens/individuals_tab.dart')
          s = p.read_text(encoding='utf-8')
          # Normalize add form sort field/controller.
          a = s.find('Future<void> _openAddForm()')
          b = s.find('Future<void> _edit', a)
          if a >= 0 and b > a:
              seg = s[a:b]
              seg = re.sub(r'(\n\s*final sortCtrl = TextEditingController\(\);){2,}', '\n    final sortCtrl = TextEditingController();', seg)
              seg = re.sub(r'\n\s*TextField\(controller: sortCtrl,.*?\),\n\s*const SizedBox\(height: 10\),', '', seg)
              marker = 'DropdownButtonFormField<String>('
              if marker in seg:
                  sort_field = "TextField(controller: sortCtrl, textAlign: TextAlign.right, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'الترتيب في القائمة (رقم - اختياري)', border: OutlineInputBorder())),\n          const SizedBox(height: 10),\n          DropdownButtonFormField<String>("
                  seg = seg.replace(marker, sort_field, 1)
              s = s[:a] + seg + s[b:]
          # Normalize edit form sort controller/field.
          a = s.find('Future<void> _edit')
          b = s.find('Future<void> _delete', a)
          if a >= 0 and b > a:
              seg = s[a:b]
              seg = re.sub(r'(\n\s*final sortCtrl = TextEditingController\(text: p\.sortOrder\.toString\(\)\);){2,}', '\n    final sortCtrl = TextEditingController(text: p.sortOrder.toString());', seg)
              seg = re.sub(r'\n\s*TextField\(controller: sortCtrl,.*?\),\n\s*const SizedBox\(height: 10\),', '', seg)
              marker = 'if (error != null)'
              if marker in seg:
                  sort_field = "TextField(controller: sortCtrl, textAlign: TextAlign.right, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'الترتيب في القائمة', border: OutlineInputBorder())),\n          if (error != null)"
                  seg = seg.replace(marker, sort_field, 1)
              s = s[:a] + seg + s[b:]
          p.write_text(s, encoding='utf-8')

          p = Path('lib/screens/individual_detail_screen.dart')
          s = p.read_text(encoding='utf-8')
          a = s.find('Future<void> _openEntryForm')
          b = s.find('Future<void> _deleteEntry', a)
          if a >= 0 and b > a:
              seg = s[a:b]
              seg = re.sub(r'(\n\s*final sortCtrl = TextEditingController\(\);){2,}', '\n    final sortCtrl = TextEditingController();', seg)
              seg = re.sub(r'\n\s*TextField\(controller: sortCtrl,.*?\),\n\s*const SizedBox\(height: 10\),', '', seg)
              marker = 'if (error != null)'
              if marker in seg:
                  sort_field = "TextField(controller: sortCtrl, textAlign: TextAlign.right, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'الترتيب في القائمة (رقم - اختياري)', border: OutlineInputBorder())),\n                const SizedBox(height: 10),\n                if (error != null)"
                  seg = seg.replace(marker, sort_field, 1)
              s = s[:a] + seg + s[b:]
          p.write_text(s, encoding='utf-8')

      - name: Check with Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

      - name: Commit normalized changes and remove cleanup workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/models/models.dart lib/api_service.dart lib/screens/gam3eyas_tab.dart lib/screens/individuals_tab.dart lib/screens/individual_detail_screen.dart
          git rm .github/workflows/ordering-cleanup.yml
          git commit -m "Finalize automatic descending ordering"
          git push