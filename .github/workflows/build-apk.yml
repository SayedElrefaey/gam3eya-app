name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Ensure Android platform files exist
        run: flutter create . --platforms=android --project-name gam3eya_app --org com.example

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Configure Android SDK and Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build = Path('android/app/build.gradle.kts')
          if build.exists():
              s = build.read_text()
              s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              s = s.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              build.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.permission.INTERNET' not in s:
              end = s.find('>')
              if end == -1:
                  raise RuntimeError('Invalid AndroidManifest.xml')
              s = s[:end + 1] + '\n    <uses-permission android:name="android.permission.INTERNET" />\n' + s[end + 1:]
              manifest.write_text(s)
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest.xml: valid XML')
          PY

      - name: Download Arabic PDF fonts
        run: |
          mkdir -p assets/fonts
          curl -L --fail --retry 3 -o assets/fonts/NotoNaskhArabic-Regular.ttf https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf
          curl -L --fail --retry 3 -o assets/fonts/NotoNaskhArabic-Bold.ttf https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Bold.ttf
          test -s assets/fonts/NotoNaskhArabic-Regular.ttf
          test -s assets/fonts/NotoNaskhArabic-Bold.ttf

      - name: Add ledger UI features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/individual_detail_screen.dart')
          s = path.read_text()

          if 'const _amountPale' not in s:
              s = s.replace('const _goldPale = Color(0xFFF8E8B8);', 'const _goldPale = Color(0xFFF8E8B8);\nconst _amountPale = Color(0xFFEAF3F5);', 1)

          s = s.replace('fontSize: 12.5,', 'fontSize: 15.5,', 1)
          s = s.replace('e.note.isEmpty ? \'حركة\' : e.note,\n                            flex: 13,\n                            background: Colors.white,\n                            textColor: Colors.black,\n                            fontSize: 15,', 'e.note.isEmpty ? \'حركة\' : e.note,\n                            flex: 13,\n                            background: Colors.white,\n                            textColor: Colors.black,\n                            fontSize: 17,', 1)
          s = s.replace('final amountBackground = isDebit ? _goldPale : _successLight;', 'final amountBackground = isDebit ? _amountPale : _successLight;', 1)

          if '_showEntryActions(Entry e)' not in s:
              marker = '  Future<void> _deleteEntry(int id) async {'
              method = '''  Future<void> _showEntryActions(Entry e) async {\n    await showModalBottomSheet(\n      context: context,\n      builder: (ctx) => SafeArea(\n        child: Column(\n          mainAxisSize: MainAxisSize.min,\n          children: [\n            ListTile(\n              leading: const Icon(Icons.edit, color: cover),\n              title: const Text('تعديل الحركة'),\n              onTap: () {\n                Navigator.pop(ctx);\n                _openEntryForm(existing: e);\n              },\n            ),\n            ListTile(\n              leading: const Icon(Icons.delete, color: Colors.red),\n              title: const Text('حذف الحركة'),\n              onTap: () async {\n                Navigator.pop(ctx);\n                final ok = await showDialog<bool>(\n                  context: context,\n                  builder: (dctx) => AlertDialog(\n                    title: const Text('حذف الحركة'),\n                    content: const Text('هل تريد حذف هذه الحركة؟'),\n                    actions: [\n                      TextButton(onPressed: () => Navigator.pop(dctx, false), child: const Text('إلغاء')),\n                      TextButton(onPressed: () => Navigator.pop(dctx, true), child: const Text('حذف', style: TextStyle(color: Colors.red))),\n                    ],\n                  ),\n                );\n                if (ok == true) await _deleteEntry(e.id);\n              },\n            ),\n          ],\n        ),\n      ),\n    );\n  }\n\n'''
              if marker not in s:
                  raise RuntimeError('Delete entry marker not found')
              s = s.replace(marker, method + marker, 1)

          old_row = '''                  return Container(\n                    margin: const EdgeInsets.only(bottom: 5),\n                    child: IntrinsicHeight(\n                      child: Row('''
          new_row = '''                  return GestureDetector(\n                    onLongPress: () => _showEntryActions(e),\n                    child: Container(\n                      margin: const EdgeInsets.only(bottom: 5),\n                      child: IntrinsicHeight(\n                        child: Row('''
          if 'onLongPress: () => _showEntryActions(e)' not in s:
              if old_row not in s:
                  raise RuntimeError('Ledger row marker not found')
              s = s.replace(old_row, new_row, 1)
              old_end = '''                      ),\n                    ),\n                  );\n                }),'''
              new_end = '''                        ),\n                      ),\n                    ),\n                  );\n                }),'''
              if old_end not in s:
                  raise RuntimeError('Ledger row closing marker not found')
              s = s.replace(old_end, new_end, 1)

          marker = '              const SizedBox(height: 10),\n              _summaryBox(totalDebit, totalCredit, running, sym),'
          if marker in s and "label: const Text('فاتورة PDF')" not in s:
              buttons = '''              const SizedBox(height: 10),\n              Row(\n                children: [\n                  Expanded(\n                    child: OutlinedButton.icon(\n                      onPressed: _sendInvoice,\n                      icon: const Icon(Icons.picture_as_pdf),\n                      label: const Text('فاتورة PDF'),\n                    ),\n                  ),\n                  const SizedBox(width: 10),\n                  Expanded(\n                    child: OutlinedButton.icon(\n                      onPressed: _sendInvoice,\n                      icon: const Icon(Icons.share),\n                      label: const Text('إرسال واتساب'),\n                    ),\n                  ),\n                ],\n              ),\n              const SizedBox(height: 10),\n              _summaryBox(totalDebit, totalCredit, running, sym),'''
              s = s.replace(marker, buttons, 1)

          path.write_text(s)
          print('Ledger UI features patched successfully')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gam3eya-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
