name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Ensure Android platform files exist
        run: flutter create . --platforms=android --project-name gam3eya_app --org com.example

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Configure Android SDK and Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('android/app/build.gradle.kts')
          if build.exists():
              s = build.read_text()
              s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              s = s.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              build.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              end = s.find('>')
              if end == -1:
                  raise RuntimeError('Invalid AndroidManifest.xml: opening manifest tag not found')
              s = s[:end + 1] + '\n' + permission + s[end + 1:]
              manifest.write_text(s)
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest.xml: valid XML')
          PY
          grep -nE 'INTERNET' android/app/src/main/AndroidManifest.xml
          grep -nE 'compileSdk|targetSdk|minSdk' android/app/build.gradle.kts || true

      - name: Download Arabic PDF fonts
        run: |
          mkdir -p assets/fonts
          curl -L --fail --retry 3 -o assets/fonts/NotoNaskhArabic-Regular.ttf \
            https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf
          curl -L --fail --retry 3 -o assets/fonts/NotoNaskhArabic-Bold.ttf \
            https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Bold.ttf
          test -s assets/fonts/NotoNaskhArabic-Regular.ttf
          test -s assets/fonts/NotoNaskhArabic-Bold.ttf

      - name: Patch ledger UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/individual_detail_screen.dart')
          s = path.read_text()

          replacements = {
              "const _goldPale = Color(0xFFF8E8B8);": "const _goldPale = Color(0xFFF8E8B8);\nconst _amountPale = Color(0xFFEAF3F5);",
              "style: const TextStyle(color: gold, fontSize: 19, fontWeight: FontWeight.bold),": "style: const TextStyle(color: gold, fontSize: 17, fontWeight: FontWeight.bold),",
              "fontSize: 12.5,": "fontSize: 15.5,",
              "fontSize: 15,\n                          ),\n                          _ledgerCell(\n                            fmtNum(e.amount),": "fontSize: 17,\n                          ),\n                          _ledgerCell(\n                            fmtNum(e.amount),",
              "final amountBackground = isDebit ? _goldPale : _successLight;": "final amountBackground = isDebit ? _amountPale : _successLight;",
          }

          for old, new in replacements.items():
              if old not in s:
                  raise RuntimeError(f'Expected source text not found: {old[:100]!r}')
              s = s.replace(old, new, 1)

          marker = "              const SizedBox(height: 10),\n              _summaryBox(totalDebit, totalCredit, running, sym),"
          insert = """              const SizedBox(height: 10),
              Row(
                children: [
                  Expanded(
                    child: OutlinedButton.icon(
                      onPressed: _sendInvoice,
                      icon: const Icon(Icons.picture_as_pdf),
                      label: const Text('فاتورة PDF'),
                      style: OutlinedButton.styleFrom(
                        foregroundColor: cover,
                        side: const BorderSide(color: gold),
                        padding: const EdgeInsets.symmetric(vertical: 12),
                      ),
                    ),
                  ),
                  const SizedBox(width: 10),
                  Expanded(
                    child: OutlinedButton.icon(
                      onPressed: () async {
                        final p = _p!;
                        final sym = currencySymbols[p.currency] ?? p.currency;
                        final entries = [...p.entries]..sort((a, b) {
                          final da = DateTime.parse(a.entryDate);
                          final db = DateTime.parse(b.entryDate);
                          final cmp = da.compareTo(db);
                          return cmp != 0 ? cmp : a.id.compareTo(b.id);
                        });
                        double runningBalance = 0;
                        final rows = <InvoiceRow>[];
                        for (final e in entries) {
                          final dt = DateTime.parse(e.entryDate);
                          final isDebit = e.type == 'debit';
                          final debit = isDebit ? e.amount : 0.0;
                          final credit = isDebit ? 0.0 : e.amount;
                          runningBalance += debit - credit;
                          rows.add(InvoiceRow(
                            date: _formatDateTime(dt),
                            details: e.note.isEmpty ? 'حركة' : e.note,
                            debit: debit,
                            credit: credit,
                            balance: runningBalance,
                            currency: sym,
                          ));
                        }
                        final bytes = await buildInvoicePdf(
                          title: 'فاتورة حساب',
                          subtitle: p.name,
                          rows: rows,
                          totals: const [],
                        );
                        if (!mounted) return;
                        await shareInvoiceViaWhatsApp(
                          bytes,
                          'فاتورة ${p.name}',
                          'فاتورة ${p.name} - الرصيد: ${fmtNum(runningBalance.abs())} $sym',
                        );
                      },
                      icon: const Icon(Icons.share),
                      label: const Text('إرسال واتساب'),
                      style: OutlinedButton.styleFrom(
                        foregroundColor: _success,
                        side: const BorderSide(color: _success),
                        padding: const EdgeInsets.symmetric(vertical: 12),
                      ),
                    ),
                  ),
                ],
              ),
              const SizedBox(height: 10),
              _summaryBox(totalDebit, totalCredit, running, sym),"""
          if marker not in s:
              raise RuntimeError('Invoice action insertion point not found')
          s = s.replace(marker, insert, 1)

          path.write_text(s)
          print('Ledger UI patched successfully')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gam3eya-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
