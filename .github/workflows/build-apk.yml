name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Ensure Android platform files exist
        run: flutter create . --platforms=android --project-name gam3eya_app --org com.example

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Configure Android SDK and Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('android/app/build.gradle.kts')
          if build.exists():
              s = build.read_text()
              s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              s = s.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              build.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              end = s.find('>')
              if end == -1:
                  raise RuntimeError('Invalid AndroidManifest.xml: opening manifest tag not found')
              s = s[:end + 1] + '\n' + permission + s[end + 1:]
              manifest.write_text(s)
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest.xml: valid XML')
          PY
          grep -nE 'INTERNET' android/app/src/main/AndroidManifest.xml
          grep -nE 'compileSdk|targetSdk|minSdk' android/app/build.gradle.kts || true

      - name: Download Arabic PDF fonts
        run: |
          mkdir -p assets/fonts
          curl -L --fail --retry 3 -o assets/fonts/NotoNaskhArabic-Regular.ttf \
            https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf
          curl -L --fail --retry 3 -o assets/fonts/NotoNaskhArabic-Bold.ttf \
            https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Bold.ttf
          test -s assets/fonts/NotoNaskhArabic-Regular.ttf
          test -s assets/fonts/NotoNaskhArabic-Bold.ttf

      - name: Patch ledger UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/individual_detail_screen.dart')
          s = path.read_text()

          replacements = {
              "const _goldPale = Color(0xFFF8E8B8);": "const _goldPale = Color(0xFFF8E8B8);\nconst _amountPale = Color(0xFFEAF3F5);",
              "style: const TextStyle(color: gold, fontSize: 19, fontWeight: FontWeight.bold),": "style: const TextStyle(color: gold, fontSize: 17, fontWeight: FontWeight.bold),",
              "fontSize: 12.5,": "fontSize: 15.5,",
              "fontSize: 15,\n                          ),\n                          _ledgerCell(\n                            fmtNum(e.amount),": "fontSize: 17,\n                          ),\n                          _ledgerCell(\n                            fmtNum(e.amount),",
              "final amountBackground = isDebit ? _goldPale : _successLight;": "final amountBackground = isDebit ? _amountPale : _successLight;",
          }

          for old, new in replacements.items():
              if old not in s:
                  raise RuntimeError(f'Expected source text not found: {old[:100]!r}')
              s = s.replace(old, new, 1)

          marker = "  Future<void> _deleteEntry(int id) async {"
          method = r'''  Future<void> _showEntryActions(Entry e) async {
    await showModalBottomSheet(
      context: context,
      builder: (ctx) => SafeArea(
        child: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            ListTile(
              leading: const Icon(Icons.edit, color: cover),
              title: const Text('تعديل الحركة'),
              onTap: () {
                Navigator.pop(ctx);
                _openEntryForm(existing: e);
              },
            ),
            ListTile(
              leading: const Icon(Icons.delete, color: Colors.red),
              title: const Text('حذف الحركة'),
              onTap: () async {
                Navigator.pop(ctx);
                final ok = await showDialog<bool>(
                  context: context,
                  builder: (dctx) => AlertDialog(
                    title: const Text('حذف الحركة'),
                    content: const Text('هل تريد حذف هذه الحركة؟'),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(dctx, false), child: const Text('إلغاء')),
                      TextButton(
                        onPressed: () => Navigator.pop(dctx, true),
                        child: const Text('حذف', style: TextStyle(color: Colors.red)),
                      ),
                    ],
                  ),
                );
                if (ok == true) await _deleteEntry(e.id);
              },
            ),
          ],
        ),
      ),
    );
  }

'''
          if '_showEntryActions(Entry e)' not in s:
              if marker not in s:
                  raise RuntimeError('Delete entry marker not found')
              s = s.replace(marker, method + marker, 1)

          old_row = '''                  return Container(
                    margin: const EdgeInsets.only(bottom: 5),
                    child: IntrinsicHeight(
                      child: Row('''
          new_row = '''                  return GestureDetector(
                    onLongPress: () => _showEntryActions(e),
                    child: Container(
                      margin: const EdgeInsets.only(bottom: 5),
                      child: IntrinsicHeight(
                        child: Row('''
          if old_row in s:
              s = s.replace(old_row, new_row, 1)
              old_end = '''                      ),
                    ),
                  );
                }),'''
              new_end = '''                        ),
                      ),
                    ),
                  );
                }),'''
              if old_end not in s:
                  raise RuntimeError('Long-press closing block not found')
              s = s.replace(old_end, new_end, 1)

          path.write_text(s)
          print('Ledger UI patched successfully')
          PY

      - name: Persist source UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/individual_detail_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m "Add long-press edit and delete for entries [skip ci]"
            git push
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gam3eya-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
