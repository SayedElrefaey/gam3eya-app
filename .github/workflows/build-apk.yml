name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Ensure Android platform files exist
        run: flutter create . --platforms=android --project-name gam3eya_app --org com.example

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Configure Android SDK and Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build = Path('android/app/build.gradle.kts')
          if build.exists():
              s = build.read_text()
              s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              s = s.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              build.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.permission.INTERNET' not in s:
              end = s.find('>')
              if end == -1:
                  raise RuntimeError('Invalid AndroidManifest.xml')
              s = s[:end + 1] + '\n    <uses-permission android:name="android.permission.INTERNET" />\n' + s[end + 1:]
              manifest.write_text(s)
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest.xml: valid XML')
          PY

      - name: Download Arabic PDF fonts
        run: |
          mkdir -p assets/fonts
          curl -L --fail --retry 3 -o assets/fonts/NotoNaskhArabic-Regular.ttf https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf
          curl -L --fail --retry 3 -o assets/fonts/NotoNaskhArabic-Bold.ttf https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Bold.ttf
          test -s assets/fonts/NotoNaskhArabic-Regular.ttf
          test -s assets/fonts/NotoNaskhArabic-Bold.ttf

      - name: Add ledger UI features
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/individual_detail_screen.dart')
          s = path.read_text()

          if 'const _amountPale' not in s:
              s = s.replace('const _goldPale = Color(0xFFF8E8B8);', 'const _goldPale = Color(0xFFF8E8B8);\nconst _amountPale = Color(0xFFEAF3F5);', 1)

          s = s.replace('fontSize: 12.5,', 'fontSize: 15.5,', 1)
          s = s.replace('e.note.isEmpty ? \'حركة\' : e.note,\n                            flex: 13,\n                            background: Colors.white,\n                            textColor: Colors.black,\n                            fontSize: 15,', 'e.note.isEmpty ? \'حركة\' : e.note,\n                            flex: 20,\n                            background: Colors.white,\n                            textColor: Colors.black,\n                            fontSize: 16,', 1)
          s = s.replace('final amountBackground = isDebit ? _goldPale : _successLight;', 'final amountBackground = isDebit ? const Color(0xFFFDE2E2) : const Color(0xFFDCF0E3);', 1)
          s = s.replace('final amountColor = isDebit ? cover : _success;', 'final amountColor = isDebit ? const Color(0xFFA3402F) : const Color(0xFF2F6B4F);', 1)
          s = s.replace("_ledgerHeaderCell('التاريخ', 16),", "_ledgerHeaderCell('التاريخ', 14),", 1)
          s = s.replace("_ledgerHeaderCell('التفاصيل', 13),", "_ledgerHeaderCell('التفاصيل', 20),", 1)
          s = s.replace("_ledgerHeaderCell('المبلغ', 10),", "_ledgerHeaderCell('المبلغ', 8),", 1)
          s = s.replace("_ledgerHeaderCell('الرصيد', 10),", "_ledgerHeaderCell('الرصيد', 8),", 1)
          s = s.replace("_ledgerCell(_formatDateTime(dt), flex: 16,", "_ledgerCell(_formatDateTime(dt), flex: 14,", 1)
          s = s.replace("_ledgerCell(fmtNum(e.amount), flex: 10,", "_ledgerCell(fmtNum(e.amount), flex: 8,", 1)
          s = s.replace("_ledgerCell(fmtNum(balance), flex: 10,", "_ledgerCell(fmtNum(balance), flex: 8,", 1)
          path.write_text(s)

          apath = Path('lib/screens/gam3eya_detail_screen.dart')
          a = apath.read_text()
          old = """                    return Container(\n                      color: isTurn ? _turnLight : (s.paid ? _successLight : Colors.white),\n                      padding: const EdgeInsets.symmetric(vertical: 8, horizontal: 5),"""
          new = """                    return Container(\n                      margin: const EdgeInsets.symmetric(horizontal: 4, vertical: 1),\n                      decoration: BoxDecoration(\n                        color: isTurn ? _turnLight : (s.paid ? _successLight : Colors.white),\n                        border: Border(bottom: BorderSide(color: _line, width: 0.8)),\n                        borderRadius: BorderRadius.circular(4),\n                      ),\n                      padding: const EdgeInsets.symmetric(vertical: 9, horizontal: 5),"""
          if old in a:
              a = a.replace(old, new, 1)
          apath.write_text(a)

          home = Path('lib/screens/home_screen.dart')
          h = home.read_text()
          start = """          Container(\n            color: cover,\n            padding: const EdgeInsets.fromLTRB(10, 10, 10, 10),\n            child: Row(children: [\n"""
          end = """            ]),\n          ),\n          Expanded(\n"""
          if start not in h or end not in h:
              raise RuntimeError('Home section selector markers not found')
          a0 = h.index(start)
          b0 = h.index(end, a0) + len("            ]),\n          ),\n")
          vertical = """          Container(\n            color: cover,\n            padding: const EdgeInsets.fromLTRB(10, 10, 10, 10),\n            child: Column(\n              crossAxisAlignment: CrossAxisAlignment.stretch,\n              children: [\n                ConstrainedBox(\n                  constraints: const BoxConstraints(maxHeight: 220),\n                  child: ListView.separated(\n                    shrinkWrap: true,\n                    itemCount: _sections.length,\n                    separatorBuilder: (_, __) => const SizedBox(height: 7),\n                    itemBuilder: (ctx, i) {\n                      final s = _sections[i];\n                      final isActive = s.id == _activeId;\n                      return Material(\n                        color: isActive ? gold : Colors.white.withOpacity(0.08),\n                        borderRadius: BorderRadius.circular(12),\n                        child: InkWell(\n                          borderRadius: BorderRadius.circular(12),\n                          onTap: () => setState(() => _activeId = s.id),\n                          child: Padding(\n                            padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 11),\n                            child: Row(children: [\n                              Expanded(\n                                child: Text(\n                                  s.name,\n                                  textAlign: TextAlign.right,\n                                  style: TextStyle(\n                                    color: isActive ? cover : Colors.white.withOpacity(0.85),\n                                    fontWeight: FontWeight.bold,\n                                    fontSize: 15,\n                                  ),\n                                ),\n                              ),\n                              Text(\n                                s.type == 'gam3eya'\n                                    ? (s.hasTurns ? 'جمعيات • أدوار' : 'جمعيات')\n                                    : 'حسابات أفراد',\n                                style: TextStyle(\n                                  color: isActive ? cover : Colors.white70,\n                                  fontSize: 11,\n                                ),\n                              ),\n                            ]),\n                          ),\n                        ),\n                      );\n                    },\n                  ),\n                ),\n                const SizedBox(height: 8),\n                Align(\n                  alignment: Alignment.centerRight,\n                  child: Material(\n                    color: Colors.white.withOpacity(0.08),\n                    shape: const CircleBorder(),\n                    child: IconButton(\n                      icon: const Icon(Icons.settings, color: Colors.white),\n                      onPressed: _openTabsManager,\n                    ),\n                  ),\n                ),\n              ],\n            ),\n          ),\n"""
          h = h[:a0] + vertical + h[b0:]
          home.write_text(h)
          print('UI patches applied successfully')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gam3eya-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
