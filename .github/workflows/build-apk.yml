name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Ensure Android platform files exist
        run: flutter create . --platforms=android --project-name gam3eya_app --org com.example

      - name: Configure Android SDK and Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('android/app/build.gradle.kts')
          if build.exists():
              s = build.read_text()
              s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              s = s.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              build.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              end = s.find('>')
              if end == -1:
                  raise RuntimeError('Invalid AndroidManifest.xml: opening manifest tag not found')
              s = s[:end + 1] + '\n' + permission + s[end + 1:]
              manifest.write_text(s)
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest.xml: valid XML')
          PY
          grep -nE 'INTERNET' android/app/src/main/AndroidManifest.xml
          grep -nE 'compileSdk|targetSdk|minSdk' android/app/build.gradle.kts || true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gam3eya-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
