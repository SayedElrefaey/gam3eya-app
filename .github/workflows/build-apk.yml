name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Ensure Android platform files exist
        run: flutter create . --platforms=android --project-name gam3eya_app --org com.example

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Configure Android SDK and Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build = Path('android/app/build.gradle.kts')
          if build.exists():
              s = build.read_text()
              s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              s = s.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              build.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.permission.INTERNET' not in s:
              end = s.find('>')
              if end == -1:
                  raise RuntimeError('Invalid AndroidManifest.xml')
              s = s[:end + 1] + '\n    <uses-permission android:name="android.permission.INTERNET" />\n' + s[end + 1:]
              manifest.write_text(s)
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest.xml: valid XML')
          PY

      - name: Download PDF fonts matching web
        run: |
          mkdir -p assets/fonts
          curl -L --fail --retry 3 -o assets/fonts/NotoNaskhArabic-Regular.ttf https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf
          curl -L --fail --retry 3 -o assets/fonts/NotoNaskhArabic-Bold.ttf https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Bold.ttf
          curl -L --fail --retry 3 -o assets/fonts/Tajawal-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf
          curl -L --fail --retry 3 -o assets/fonts/Tajawal-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf
          curl -L --fail --retry 3 -o assets/fonts/Amiri-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf
          curl -L --fail --retry 3 -o assets/fonts/Amiri-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf
          test -s assets/fonts/NotoNaskhArabic-Regular.ttf
          test -s assets/fonts/NotoNaskhArabic-Bold.ttf
          test -s assets/fonts/Tajawal-Regular.ttf
          test -s assets/fonts/Tajawal-Bold.ttf
          test -s assets/fonts/Amiri-Regular.ttf
          test -s assets/fonts/Amiri-Bold.ttf

      - name: Set app name and dollar launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          application = re.search(r'<application\b[^>]*>', s, flags=re.S)
          if not application:
              raise RuntimeError('AndroidManifest.xml: <application> not found')

          tag = application.group(0)
          tag = re.sub(r'\s+android:label="[^"]*"', '', tag, count=1)
          tag = re.sub(r'\s+android:icon="[^"]*"', '', tag, count=1)
          tag = re.sub(r'\s+android:roundIcon="[^"]*"', '', tag, count=1)
          tag = tag[:-1] + ' android:label="حسابتى" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher">'
          s = s[:application.start()] + tag + s[application.end():]
          manifest.write_text(s)

          icon = Path('android/app/src/main/res/drawable/ic_launcher.xml')
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D3B2E"
                  android:pathData="M14,14 L94,14 Q98,14 98,18 L98,90 Q98,94 94,94 L14,94 Q10,94 10,90 L10,18 Q10,14 14,14 Z"/>
              <path
                  android:fillColor="#D9A62E"
                  android:pathData="M61,27 C52,23 40,24 36,31 C31,40 38,45 49,48 C59,51 64,54 64,60 C64,66 58,70 50,70 C42,70 36,67 31,63 L27,72 C33,77 41,80 50,81 L50,88 L58,88 L58,81 C69,78 76,71 76,61 C76,50 68,45 55,42 C46,40 42,38 43,35 C44,32 49,31 53,31 C60,31 65,33 69,36 L74,28 C70,26 66,25 61,24 Z"/>
          </vector>
          ''')
          print('App name set to حسابتى and dollar vector launcher icon generated')
          PY

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gam3eya-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
