name: One-time automatic descending mobile ordering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Auto apply mobile descending ordering') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile ordering logic
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Models: keep the explicit order from the web/API.
          p = Path('lib/models/models.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "  final String currency;\n  final List<ScheduleItem> schedule;",
              "  final String currency;\n  final int sortOrder;\n  final List<ScheduleItem> schedule;",
              1)
          s = s.replace(
              "  Gam3eya({required this.id, required this.sectionId, required this.name, required this.startDate, required this.months, required this.intervalMonths, required this.monthlyAmount, required this.currency, required this.schedule, required this.myTurns, required this.hasTurns});",
              "  Gam3eya({required this.id, required this.sectionId, required this.name, required this.startDate, required this.months, required this.intervalMonths, required this.monthlyAmount, required this.currency, required this.sortOrder, required this.schedule, required this.myTurns, required this.hasTurns});",
              1)
          s = s.replace(
              "        currency: j['currency'].toString(),\n        schedule:",
              "        currency: j['currency'].toString(),\n        sortOrder: int.tryParse((j['sort_order'] ?? j['sortOrder'] ?? 0).toString()) ?? 0,\n        schedule:",
              1)
          s = s.replace(
              "  final String entryDate;\n\n  Entry({required this.id, required this.note, required this.amount, required this.type, required this.entryDate});",
              "  final String entryDate;\n  final int sortOrder;\n\n  Entry({required this.id, required this.note, required this.amount, required this.type, required this.entryDate, required this.sortOrder});",
              1)
          s = s.replace(
              "        type: j['type'].toString(),\n        entryDate: j['entry_date'].toString(),",
              "        type: j['type'].toString(),\n        entryDate: j['entry_date'].toString(),\n        sortOrder: int.tryParse((j['sort_order'] ?? j['sortOrder'] ?? 0).toString()) ?? 0,",
              1)
          s = s.replace(
              "  final String currency;\n  final List<Entry> entries;",
              "  final String currency;\n  final int sortOrder;\n  final List<Entry> entries;",
              1)
          s = s.replace(
              "  Individual({required this.id, required this.sectionId, required this.name, required this.phone, required this.currency, required this.entries});",
              "  Individual({required this.id, required this.sectionId, required this.name, required this.phone, required this.currency, required this.sortOrder, required this.entries});",
              1)
          s = s.replace(
              "        currency: j['currency'].toString(),\n        entries:",
              "        currency: j['currency'].toString(),\n        sortOrder: int.tryParse((j['sort_order'] ?? j['sortOrder'] ?? 0).toString()) ?? 0,\n        entries:",
              1)
          p.write_text(s, encoding='utf-8')

          # API service: accept and send explicit order when supplied.
          p = Path('lib/api_service.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "    List<int> myTurnMonths = const [],\n  }) async {",
              "    List<int> myTurnMonths = const [],\n    int sortOrder = 0,\n  }) async {",
              1)
          s = s.replace(
              "        'myTurnMonths': myTurnMonths,\n      }),",
              "        'myTurnMonths': myTurnMonths,\n        'sortOrder': sortOrder,\n      }),",
              1)
          s = s.replace(
              "  static Future<void> renameGam3eya(int id, String name) async {\n    final res = await _client.put(_uri('gam3eyas'), headers: _headers, body: jsonEncode({'id': id, 'name': name}));",
              "  static Future<void> renameGam3eya(int id, String name, {int? sortOrder}) async {\n    final body = <String, dynamic>{'id': id, 'name': name, if (sortOrder != null) 'sortOrder': sortOrder};\n    final res = await _client.put(_uri('gam3eyas'), headers: _headers, body: jsonEncode(body));",
              1)
          s = s.replace(
              "  static Future<void> addIndividual({required int sectionId, required String name, required String phone, required String currency}) async {\n    final res = await _client.post(_uri('individuals'), headers: _headers, body: jsonEncode({'sectionId': sectionId, 'name': name, 'phone': phone, 'currency': currency}));",
              "  static Future<void> addIndividual({required int sectionId, required String name, required String phone, required String currency, int sortOrder = 0}) async {\n    final res = await _client.post(_uri('individuals'), headers: _headers, body: jsonEncode({'sectionId': sectionId, 'name': name, 'phone': phone, 'currency': currency, 'sortOrder': sortOrder}));",
              1)
          s = s.replace(
              "  static Future<void> updateIndividual({required int id, required String name, required String phone, required String currency}) async {\n    final res = await _client.put(_uri('individuals'), headers: _headers, body: jsonEncode({'id': id, 'name': name, 'phone': phone, 'currency': currency}));",
              "  static Future<void> updateIndividual({required int id, required String name, required String phone, required String currency, int? sortOrder}) async {\n    final body = <String, dynamic>{'id': id, 'name': name, 'phone': phone, 'currency': currency, if (sortOrder != null) 'sortOrder': sortOrder};\n    final res = await _client.put(_uri('individuals'), headers: _headers, body: jsonEncode(body));",
              1)
          s = s.replace(
              "  static Future<void> addEntry({required int individualId, required String note, required double amount, required String type, required String date}) async {\n    final res = await _client.post(_uri('entries'), headers: _headers, body: jsonEncode({'individualId': individualId, 'note': note, 'amount': amount, 'type': type, 'date': date}));",
              "  static Future<void> addEntry({required int individualId, required String note, required double amount, required String type, required String date, int sortOrder = 0}) async {\n    final res = await _client.post(_uri('entries'), headers: _headers, body: jsonEncode({'individualId': individualId, 'note': note, 'amount': amount, 'type': type, 'date': date, 'sortOrder': sortOrder}));",
              1)
          s = s.replace(
              "  static Future<void> updateEntry({required int id, required String note, required double amount, required String type, required String date}) async {\n    final res = await _client.put(_uri('entries'), headers: _headers, body: jsonEncode({'id': id, 'note': note, 'amount': amount, 'type': type, 'date': date}));",
              "  static Future<void> updateEntry({required int id, required String note, required double amount, required String type, required String date, int? sortOrder}) async {\n    final body = <String, dynamic>{'id': id, 'note': note, 'amount': amount, 'type': type, 'date': date, if (sortOrder != null) 'sortOrder': sortOrder};\n    final res = await _client.put(_uri('entries'), headers: _headers, body: jsonEncode(body));",
              1)
          p.write_text(s, encoding='utf-8')

          # Groups: auto next number, descending display, and manual override stays available.
          p = Path('lib/screens/gam3eyas_tab.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "  String _intervalLabel(int interval) {",
              "  int _nextSortOrder() {\n    final values = _items.map((g) => g.sortOrder).toList();\n    return (values.isEmpty ? 0 : values.reduce((a, b) => a > b ? a : b)) + 1;\n  }\n\n  String _intervalLabel(int interval) {",
              1)
          s = s.replace(
              "    final amountCtrl = TextEditingController();\n    DateTime? startDate;",
              "    final amountCtrl = TextEditingController();\n    final sortCtrl = TextEditingController();\n    DateTime? startDate;",
              1)
          s = s.replace(
              "    int intervalMonths = 1;\n    final selectedTurns",
              "    int intervalMonths = 1;\n    sortCtrl.text = _nextSortOrder().toString();\n    final selectedTurns",
              1)
          s = s.replace(
              "                  const SizedBox(height: 10),\n                  DropdownButtonFormField<String>(",
              "                  const SizedBox(height: 10),\n                  TextField(controller: sortCtrl, textAlign: TextAlign.right, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'الترتيب في القائمة (رقم - اختياري)', border: OutlineInputBorder())),\n                  const SizedBox(height: 10),\n                  DropdownButtonFormField<String>(",
              1)
          s = s.replace(
              "                            currency: currency,\n                            myTurnMonths:",
              "                            currency: currency,\n                            sortOrder: int.tryParse(sortCtrl.text) ?? _nextSortOrder(),\n                            myTurnMonths:",
              1)
          s = s.replace(
              "    amountCtrl.dispose();\n  }",
              "    amountCtrl.dispose();\n    sortCtrl.dispose();\n  }",
              1)
          s = s.replace(
              "  Future<void> _rename(Gam3eya g) async {\n    final ctrl = TextEditingController(text: g.name);",
              "  Future<void> _rename(Gam3eya g) async {\n    final ctrl = TextEditingController(text: g.name);\n    final sortCtrl = TextEditingController(text: g.sortOrder.toString());",
              1)
          s = s.replace(
              "        content: TextField(controller: ctrl, textAlign: TextAlign.right),",
              "        content: Column(mainAxisSize: MainAxisSize.min, children: [TextField(controller: ctrl, textAlign: TextAlign.right, decoration: const InputDecoration(labelText: 'اسم الجمعية')), const SizedBox(height: 10), TextField(controller: sortCtrl, textAlign: TextAlign.right, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'الترتيب في القائمة'))]),",
              1)
          s = s.replace(
              "    ctrl.dispose();\n    if (res != null && res.isNotEmpty) {\n      try {\n        await ApiService.renameGam3eya(g.id, res);",
              "    ctrl.dispose();\n    final sortOrder = int.tryParse(sortCtrl.text) ?? g.sortOrder;\n    sortCtrl.dispose();\n    if (res != null && res.isNotEmpty) {\n      try {\n        await ApiService.renameGam3eya(g.id, res, sortOrder: sortOrder);",
              1)
          s = s.replace(
              "    return Scaffold(\n      backgroundColor: _paper,",
              "    _all.sort((a, b) => b.sortOrder.compareTo(a.sortOrder));\n    return Scaffold(\n      backgroundColor: _paper,",
              1)
          p.write_text(s, encoding='utf-8')

          # Individuals: auto next number, descending display, manual override stays available.
          p = Path('lib/screens/individuals_tab.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "  List<Individual> get _items => _all.where((p) => p.sectionId == widget.section.id).toList();",
              "  List<Individual> get _items => (_all.where((p) => p.sectionId == widget.section.id).toList()..sort((a, b) => b.sortOrder.compareTo(a.sortOrder)));\n\n  int _nextSortOrder() {\n    final values = _items.map((p) => p.sortOrder).toList();\n    return (values.isEmpty ? 0 : values.reduce((a, b) => a > b ? a : b)) + 1;\n  }",
              1)
          s = s.replace(
              "    final phoneCtrl = TextEditingController();\n    String currency = 'EGP';",
              "    final phoneCtrl = TextEditingController();\n    final sortCtrl = TextEditingController();\n    sortCtrl.text = _nextSortOrder().toString();\n    String currency = 'EGP';",
              1)
          s = s.replace(
              "          const SizedBox(height: 10),\n          DropdownButtonFormField<String>(",
              "          const SizedBox(height: 10),\n          TextField(controller: sortCtrl, textAlign: TextAlign.right, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'الترتيب في القائمة (رقم - اختياري)', border: OutlineInputBorder())),\n          const SizedBox(height: 10),\n          DropdownButtonFormField<String>(",
              1)
          s = s.replace(
              "await ApiService.addIndividual(sectionId: widget.section.id, name: nameCtrl.text.trim(), phone: phoneCtrl.text.trim(), currency: currency);",
              "await ApiService.addIndividual(sectionId: widget.section.id, name: nameCtrl.text.trim(), phone: phoneCtrl.text.trim(), currency: currency, sortOrder: int.tryParse(sortCtrl.text) ?? _nextSortOrder());",
              1)
          s = s.replace(
              "    await showModalBottomSheet(\n      context: context,\n      isScrollControlled: true,\n      builder: (ctx) => StatefulBuilder",
              "    final sortCtrl = TextEditingController(text: p.sortOrder.toString());\n    await showModalBottomSheet(\n      context: context,\n      isScrollControlled: true,\n      builder: (ctx) => StatefulBuilder",
              1)
          # Add sort field in edit sheet after currency selector block.
          marker = "          if (error != null) Padding(padding: const EdgeInsets.only(top: 8), child: Text(error!, style: const TextStyle(color: Colors.red))),"
          s = s.replace(marker,
              "          const SizedBox(height: 10),\n          TextField(controller: sortCtrl, textAlign: TextAlign.right, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'الترتيب في القائمة', border: OutlineInputBorder())),\n" + marker,
              1)
          s = s.replace(
              "await ApiService.updateIndividual(id: p.id, name: nameCtrl.text.trim(), phone: phoneCtrl.text.trim(), currency: currency);",
              "await ApiService.updateIndividual(id: p.id, name: nameCtrl.text.trim(), phone: phoneCtrl.text.trim(), currency: currency, sortOrder: int.tryParse(sortCtrl.text) ?? p.sortOrder);",
              1)
          # Dispose edit sort controller after the modal.
          edit_anchor = "    );\n  }\n\n  Future<void> _delete(Individual p) async {"
          s = s.replace(edit_anchor, "    );\n    sortCtrl.dispose();\n  }\n\n  Future<void> _delete(Individual p) async {", 1)
          p.write_text(s, encoding='utf-8')

          # Individual detail: explicit order for entries and descending list display.
          p = Path('lib/screens/individual_detail_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "    final amountCtrl = TextEditingController(text: existing != null ? existing.amount.toString() : '');\n    String type = existing?.type ?? 'debit';",
              "    final amountCtrl = TextEditingController(text: existing != null ? existing.amount.toString() : '');\n    final sortCtrl = TextEditingController();\n    final existingOrder = existing?.sortOrder ?? 0;\n    final nextOrder = _p == null || _p!.entries.isEmpty ? 1 : (_p!.entries.map((e) => e.sortOrder).reduce((a, b) => a > b ? a : b) + 1);\n    sortCtrl.text = existing != null ? existingOrder.toString() : nextOrder.toString();\n    String type = existing?.type ?? 'debit';",
              1)
          s = s.replace(
              "                if (error != null) Padding(padding: const EdgeInsets.only(top: 8), child: Text(error!, style: const TextStyle(color: Colors.red), textAlign: TextAlign.right)),",
              "                TextField(controller: sortCtrl, textAlign: TextAlign.right, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'الترتيب في القائمة (رقم - اختياري)', border: OutlineInputBorder())),\n                const SizedBox(height: 10),\n                if (error != null) Padding(padding: const EdgeInsets.only(top: 8), child: Text(error!, style: const TextStyle(color: Colors.red), textAlign: TextAlign.right)),",
              1)
          s = s.replace(
              "await ApiService.updateEntry(id: existing.id, note: noteCtrl.text.trim(), amount: amount, type: type, date: dateStr);",
              "await ApiService.updateEntry(id: existing.id, note: noteCtrl.text.trim(), amount: amount, type: type, date: dateStr, sortOrder: int.tryParse(sortCtrl.text) ?? existingOrder);",
              1)
          s = s.replace(
              "await ApiService.addEntry(individualId: widget.id, note: noteCtrl.text.trim(), amount: amount, type: type, date: dateStr);",
              "await ApiService.addEntry(individualId: widget.id, note: noteCtrl.text.trim(), amount: amount, type: type, date: dateStr, sortOrder: int.tryParse(sortCtrl.text) ?? nextOrder);",
              1)
          s = s.replace(
              "    noteCtrl.dispose();\n    amountCtrl.dispose();",
              "    noteCtrl.dispose();\n    amountCtrl.dispose();\n    sortCtrl.dispose();",
              1)
          # Sort only the visual ledger list by explicit order; balances remain chronological.
          s = s.replace(
              "    final balances = <int, double>{};\n    double running = 0;",
              "    final balances = <int, double>{};\n    final displayEntries = [...chronological]..sort((a, b) => b.sortOrder.compareTo(a.sortOrder));\n    double running = 0;",
              1)
          s = s.replace(
              "                ...chronological.reversed.map((e) {",
              "                ...displayEntries.map((e) {",
              1)
          p.write_text(s, encoding='utf-8')

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/models/models.dart lib/api_service.dart lib/screens/gam3eyas_tab.dart lib/screens/individuals_tab.dart lib/screens/individual_detail_screen.dart
          git rm .github/workflows/auto-ordering.yml
          git commit -m "Auto apply mobile descending ordering"
          git push